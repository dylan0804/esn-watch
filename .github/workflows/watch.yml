name: ESN watcher

on:
  schedule:
    # Every 15 min, offset from :00 (GitHub's busiest minute, when runs get delayed or dropped).
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [check, test-notify, dry-run]
        default: check

permissions:
  contents: write # commit state.json back

concurrency:
  group: esn-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8 # program caps itself at 2 min, so it is never killed mid-send
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # no dependencies; caching only adds time

      - name: Check for new events
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          case "${{ inputs.mode || 'check' }}" in
            test-notify) go run . -test-notify ;;
            dry-run)     go run . -dry-run -state /tmp/dry-state.json ;;
            *)           go run . ;;
          esac

      # Runs even if the check failed, so the failure streak is saved.
      - name: Save state
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "esn-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update state"
          for i in 1 2 3; do
            git pull --rebase -X theirs --quiet && git push --quiet && exit 0
            sleep 5
          done
          echo "::error::could not push state.json"
          exit 1
